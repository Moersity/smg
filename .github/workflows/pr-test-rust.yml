name: Fork CI (Linux Rust and pre-commit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  pre-commit:
    if: github.repository == 'Moersity/smg'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit checks
        env:
          SKIP: rustfmt,clippy,no-commit-to-branch,branch-name-check,dco-check,no-ai-co-author
        run: pre-commit run --all-files --show-diff-on-failure

  rust-lint:
    if: github.repository == 'Moersity/smg'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-lint
      - name: Install OpenCV build dependencies
        run: AUTO_INSTALL=1 bash scripts/install_opencv.sh
      - name: Build WASM test fixtures
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh
      - name: Run lint
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Lint the self-hosted-only build (no provider routers)
        run: |
          source "$HOME/.cargo/env"
          cargo clippy -p smg -p smg-external-router --no-default-features --features smg/grpc-client,smg/jemalloc-stats --all-targets -- -D warnings
      - name: Lint a single-provider build (Anthropic only)
        run: |
          source "$HOME/.cargo/env"
          cargo clippy -p smg -p smg-external-router --no-default-features --features smg/grpc-client,smg/jemalloc-stats,smg/provider-anthropic --all-targets -- -D warnings
      - name: Run fmt
        run: |
          source "$HOME/.cargo/env"
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt -- --check
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  rust-tests:
    if: github.repository == 'Moersity/smg'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: unit-tests
      - name: Verify default multimodal build does not require OpenCV
        run: |
          source "$HOME/.cargo/env"
          cargo check -p llm-multimodal
          cargo check --manifest-path bindings/python/Cargo.toml
          cargo check --manifest-path bindings/golang/Cargo.toml
      - name: Install OpenCV build dependencies
        run: AUTO_INSTALL=1 bash scripts/install_opencv.sh
      - name: Build WASM test fixtures
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh
      - name: Generate vision golden fixtures
        id: vision-golden
        continue-on-error: true
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers pillow numpy scipy
          python crates/multimodal/scripts/generate_vision_golden.py --strict
      - name: Build the Rust tests
        timeout-minutes: 45
        run: |
          source "$HOME/.cargo/env"
          cargo test --no-run
          cargo test -p llm-tokenizer --features tokenizers-v1 --no-run
          cargo test -p data-connector --test postgres_integration --no-run
      - name: Run Rust tests
        timeout-minutes: 30
        env:
          DATA_CONNECTOR_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/smg_test
        run: |
          source "$HOME/.cargo/env"
          cargo test
          cargo test -p llm-tokenizer --features tokenizers-v1
          cargo test -p data-connector --test postgres_integration -- --ignored --test-threads=1
      - name: Fail if vision golden fixtures did not generate
        if: steps.vision-golden.outcome == 'failure'
        run: |
          echo "::error::Vision golden fixture generation failed; see the 'Generate vision golden fixtures' step"
          exit 1
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
