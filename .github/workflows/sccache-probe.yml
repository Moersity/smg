name: sccache Wrapper Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'Moersity/smg'
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: sccache-probe
      - name: Compile the CI test targets
        run: |
          source "$HOME/.cargo/env"
          cargo -vv test --no-run
          cargo -vv test -p llm-tokenizer --features tokenizers-v1 --no-run
          cargo -vv test -p data-connector --test postgres_integration --no-run
          sccache --show-stats
